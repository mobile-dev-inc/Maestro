name: Test E2E

on:
  workflow_dispatch:
    inputs:
      android_version:
        # Free-form: floor is `min` in maestro-android/supported-apis.properties, no ceiling (a bump tests max+1 first).
        description: 'Android API level to test against, e.g. android-36'
        required: false
        type: string
        default: 'android-32'
      app:
        description: 'App workspace to test (e.g. demo_app, simple_web_view). Empty = all apps.'
        type: string
        default: 'demo_app'
      flow:
        description: 'Optional: flow filename within the chosen app (e.g. setLocation). Empty = all flows. Single-flow mode runs Android only.'
        type: string
        default: ''
      platform:
        description: 'Platform to test against (workflow_dispatch only; pull_request runs all three).'
        type: choice
        default: 'android'
        options:
          - 'android'
          - 'ios'
          - 'web'
  pull_request:

# Cancel an in-progress run when a new one starts on the same ref + same trigger + same dispatch
# inputs. PR pushes cancel earlier PR runs on the same branch; manual dispatches with different
# android_version / platform / app / flow stay independent so we can validate combinations in parallel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.android_version || '' }}-${{ inputs.platform || '' }}-${{ inputs.app || '' }}-${{ inputs.flow || '' }}
  cancel-in-progress: true

env:
  # cmdline-tools for the GitHub runner (test-android, test-start-device). Test-rig tooling, not a
  # fleet pin; the fleet's pins live in maestro-device. Bump when a new image or device profile needs it.
  ANDROID_CMDLINE_TOOLS_ZIP: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip

jobs:
  validate-inputs:
    name: Validate workflow inputs
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      flow_path: ${{ steps.resolve.outputs.flow_path }}
    steps:
      - uses: actions/checkout@v6

      # Before the checks that read it: a malformed manifest would otherwise make the app check
      # below reject a name that is perfectly valid.
      - name: Validate e2e workspace manifest
        run: e2e/validate_workspaces

      - name: Validate android_version
        run: |
          version="${{ inputs.android_version }}"
          suffix="${version#android-}"
          if [ -z "$version" ] || [ "$suffix" = "$version" ] || ! printf '%s' "$suffix" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
            echo "::error::android_version malformed: '$version' (expected android-<N> or android-<N>.<M>)"
            exit 1
          fi
          api="${suffix%%.*}"
          min=$(sed -n 's/^min=//p' maestro-android/supported-apis.properties)
          if ! printf '%s' "$min" | grep -qE '^[0-9]+$'; then
            echo "::error::maestro-android/supported-apis.properties: min malformed (got '$min', expected min=<N>)"
            exit 1
          fi
          if [ "$api" -lt "$min" ]; then
            echo "::error::android_version must be >= android-$min, the driver's declared min (got: $version)"
            exit 1
          fi

      - name: Validate app
        if: inputs.app != ''
        run: |
          # list_workspaces reads e2e/workspaces.txt, so this step does not need to know how
          # that file is laid out — and a new workspace needs no change here.
          app="${{ inputs.app }}"
          if ! e2e/list_workspaces | grep -qx "$app"; then
            echo "::error::Unknown app: '$app'. Available:"
            e2e/list_workspaces | sed 's/^/  /'
            exit 1
          fi

      - name: Resolve flow
        id: resolve
        if: inputs.flow != ''
        run: |
          app="${{ inputs.app }}"
          [ -z "$app" ] && app="demo_app"
          if [ "$app" = "demo_app" ]; then
            workspace_dir="e2e/demo_app/.maestro"
          else
            workspace_dir="e2e/workspaces/$app"
          fi

          name="${{ inputs.flow }}"
          name="${name%.yaml}"
          matches=$(find "$workspace_dir" -type f -name "${name}.yaml")
          count=$(printf "%s\n" "$matches" | grep -cv '^$' || true)

          if [ "$count" -eq 0 ]; then
            echo "::error::No flow '$name' under $workspace_dir. Available:"
            find "$workspace_dir" -type f -name "*.yaml" | xargs -n1 basename | sed 's/\.yaml$//' | sort -u
            exit 1
          fi
          if [ "$count" -gt 1 ]; then
            echo "::error::Multiple matches for '$name':"
            printf "%s\n" "$matches"
            exit 1
          fi

          # run_tests runs with working-directory: ${{ github.workspace }}/e2e, so strip the
          # leading e2e/ to make the path resolve relative to that working directory.
          relative_path="${matches#e2e/}"
          echo "Resolved: $matches (relative to e2e/: $relative_path)"
          echo "flow_path=$relative_path" >> "$GITHUB_OUTPUT"
          echo "abs_path=$matches" >> "$GITHUB_OUTPUT"

      - name: Validate flow vs platform
        if: inputs.flow != ''
        env:
          PLATFORM: ${{ inputs.platform }}
          FLOW_PATH: ${{ steps.resolve.outputs.abs_path }}
          FLOW_REL: ${{ steps.resolve.outputs.flow_path }}
        run: |
          # Read platform tags from the flow's YAML frontmatter. We only look between
          # `tags:` and the first `---` so we don't pick up step-level dashes.
          flow_tags=$(awk '
            /^tags:/ {flag=1; next}
            /^---/   {exit}
            flag && /^[[:space:]]*-[[:space:]]/ {gsub(/^[[:space:]]*-[[:space:]]*/, ""); print}
          ' "$FLOW_PATH")
          platform_tags=$(printf "%s\n" "$flow_tags" | grep -E '^(android|ios|web)$' || true)

          # No platform tags = cross-platform flow, allow.
          if [ -z "$platform_tags" ]; then
            echo "Flow $FLOW_REL has no platform tags; allowing on platform '$PLATFORM'."
            exit 0
          fi

          # Platform must be one of the declared tags.
          if ! printf "%s\n" "$platform_tags" | grep -qx "$PLATFORM"; then
            tags_csv=$(printf "%s\n" "$platform_tags" | paste -sd, -)
            echo "::error::Flow $FLOW_REL is tagged for [$tags_csv] but you requested platform '$PLATFORM'."
            exit 1
          fi

  # Ubuntu-only and ahead of the build, so a malformed manifest costs seconds instead of three
  # platforms' worth of Gradle. Unlike validate-inputs this runs on every event, since a manifest
  # can be broken by any push, not just by a manual dispatch.
  validate-manifest:
    name: Validate e2e workspace manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - run: e2e/validate_workspaces

  # Gates the driver rebuilds below. Paths mirror update-drivers.yaml's `android`/`ios` filters.
  detect-changes:
    name: Detect driver changes
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.dispatch.outputs.android || steps.filter.outputs.android }}
      ios: ${{ steps.dispatch.outputs.ios || steps.filter.outputs.ios }}
    steps:
      # Manual runs can't diff against a base, so rebuild everything to be safe.
      - name: Rebuild all on manual dispatch
        id: dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "android=true" >> "$GITHUB_OUTPUT"
          echo "ios=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        if: github.event_name != 'workflow_dispatch'
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            android:
              - 'maestro-android/**'
              - 'maestro-client/src/main/resources/maestro-app.apk'
              - 'maestro-client/src/main/resources/maestro-server.apk'
            ios:
              - 'maestro-ios-xctest-runner/**'
              - 'maestro-ios-driver/src/main/resources/**'

  build:
    name: Build on ${{ matrix.os }}
    needs: [validate-inputs, detect-changes, validate-manifest]
    # always() keeps the build running when validate-inputs is skipped, which it is on every
    # pull request — but it also means a failed dependency is ignored unless named here. Anything
    # added to needs above must be asserted below, or it gates nothing.
    if: ${{ always() && (needs.validate-inputs.result == 'success' || needs.validate-inputs.result == 'skipped') && needs.validate-manifest.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java-version: [17]

    defaults:
      run:
        shell: bash

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ matrix.java-version }}
          cache: gradle

      - name: Build Android drivers
        if: needs.detect-changes.outputs.android != 'false'
        run: ./gradlew :maestro-android:assemble :maestro-android:assembleAndroidTest

      # Redundant on macOS: :maestro-cli:distZip already runs :maestro-ios-driver:buildIosDriver (the same xcodebuild) via processResources, so the CLI step below rebuilds the runner anyway.
      # - name: Build iOS drivers
      #   if: runner.os == 'macOS'
      #   run: ./maestro-ios-xctest-runner/build-maestro-ios-runner.sh | xcbeautify

      # Skip the (macOS-only) iOS runner rebuild when its source is unchanged — distZip bundles the committed zips instead. Any other state (changed/dispatch/detection failed) rebuilds.
      - name: Build Maestro CLI
        run: ./gradlew :maestro-cli:distZip ${{ needs.detect-changes.outputs.ios == 'false' && '-x :maestro-ios-driver:buildIosDriver' || '' }}

      - name: Upload Maestro CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: maestro-cli-${{ matrix.os }}-jdk${{ matrix.java-version }}-run_id${{ github.run_id }}
          path: maestro-cli/build/distributions/maestro.zip
          retention-days: 1

      # The Gradle daemon keeps open handles on ~/.gradle/caches/*.lock; on Windows that
      # makes setup-java's post-step cache tar fail ("Device or resource busy", exit 2), so
      # the gradle cache never saves. Stop the daemon here (a normal step, so it runs before
      # the post-step) to release the locks. Windows-only; harmless to skip elsewhere.
      - name: Stop Gradle daemon so the cache can save (Windows)
        if: always() && runner.os == 'Windows'
        run: ./gradlew --stop

  test-web:
    name: Test on Web
    runs-on: ubuntu-latest
    needs: [build, validate-inputs]
    if: ${{ always() && needs.build.result == 'success' && (needs.validate-inputs.result == 'success' || needs.validate-inputs.result == 'skipped') && (github.event_name == 'pull_request' || inputs.platform == 'web') && inputs.flow == '' }}

    # MAESTRO_APP is deliberately not passed: the app input names an app workspace, and the
    # only web workspace has no app. Passing the input's demo_app default would filter the run
    # down to a workspace that does not support web, and nothing would run.

    steps:
      - name: Clone repository (only needed for the e2e directory)
        uses: actions/checkout@v6


      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          # Kept at a pinned major rather than `stable`, so a Chrome release cannot fail unrelated PRs.
          chrome-version: 151

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: maestro-cli-macos-latest-jdk17-run_id${{ github.run_id }}

      - name: Add Maestro CLI executable to PATH
        run: |
          unzip maestro.zip -d maestro_extracted
          echo "$PWD/maestro_extracted/maestro/bin" >> $GITHUB_PATH

      - name: Check if Maestro CLI executable starts up
        run: |
          maestro --help
          maestro --version

      - name: Run tests
        working-directory: ${{ github.workspace }}/e2e
        timeout-minutes: 20
        run: ./run_tests web

      - name: Upload ~/.maestro artifacts
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: maestro-root-dir-web
          path: ~/.maestro
          retention-days: 7
          include-hidden-files: true

  test-android:
    name: Test on Android
    runs-on: ubuntu-latest
    needs: [build, validate-inputs]
    if: ${{ always() && needs.build.result == 'success' && (needs.validate-inputs.result == 'success' || needs.validate-inputs.result == 'skipped') && (github.event_name == 'pull_request' || inputs.platform == 'android') }}
    timeout-minutes: 60

    env:
      ANDROID_HOME: /home/runner/androidsdk
      ANDROID_SDK_ROOT: /home/runner/androidsdk
      ANDROID_AVD_HOME: /home/runner/.android/avd/
      ANDROID_OS_IMAGE: system-images;${{ inputs.android_version || 'android-32' }};google_apis;x86_64
      MAESTRO_APP: ${{ inputs.app }}
      MAESTRO_FLOW_PATH: ${{ needs.validate-inputs.outputs.flow_path }}

    steps:
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Clone repository (only needed for the e2e directory)
        uses: actions/checkout@v6


      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android Command-line Tools
        run: |
          sh .github/scripts/install_android_sdk "$ANDROID_CMDLINE_TOOLS_ZIP"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$PATH" >> $GITHUB_PATH

      - name: Set up Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install emulator
          echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH
          sdkmanager --install "platform-tools"
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          sdkmanager --install "$ANDROID_OS_IMAGE"

      - name: Build demo_app # Or fetch cached version
        uses: ./.github/actions/build-demo-app
        with:
          platform: android

      - name: Download Maestro build from previous job
        uses: actions/download-artifact@v8
        with:
          name: maestro-cli-macos-latest-jdk17-run_id${{ github.run_id }}

      - name: Add Maestro CLI executable to PATH
        run: |
          unzip maestro.zip -d maestro_extracted
          echo "$PWD/maestro_extracted/maestro/bin" >> $GITHUB_PATH

      - name: Check if Maestro CLI executable starts up
        run: |
          maestro --help
          maestro --version

      - name: Create AVD
        run: |
          avdmanager -s create avd \
            --package "$ANDROID_OS_IMAGE" \
            --name "MyAVD"

          # cmdline-tools too old for the image write target=android-0 and the guest aborts at boot.
          echo "=== avdmanager version + AVD target ==="
          avdmanager --version 2>/dev/null || true
          grep -H '^target=' "$ANDROID_AVD_HOME/MyAVD.ini" || echo "no target= line found in $ANDROID_AVD_HOME/MyAVD.ini"

          echo "DEBUG INFO"
          
          avdmanager list avd

          echo "ANDROID_PREFS_ROOT=$ANDROID_PREFS_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_HOME=$ANDROID_SDK_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
          echo "ANDROID_EMULATOR_HOME=$ANDROID_EMULATOR_HOME"
          
          echo "HOME=$HOME"
          
          cat << EOF >> "$ANDROID_AVD_HOME/MyAVD.avd/config.ini"
          hw.cpu.ncore=4
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader_indirect
          hw.ramSize=4192
          disk.dataPartition.size=6442450944
          vm.heapSize=112M
          hw.lcd.density=240
          hw.lcd.height=1280
          hw.lcd.width=606
          EOF

      - name: Run AVD
        run: |
          emulator @MyAVD \
            -verbose -no-snapshot -no-window -no-audio -no-boot-anim -accel on -no-metrics -camera-back emulated \
            >~/emulator_stdout.log \
            2>~/emulator_stderr.log &

      - name: Wait for AVD to start up and configure CI pre-conditions
        run: bash .github/scripts/setup_android_device.sh

      - name: Install apps
        working-directory: ${{ github.workspace }}/e2e
        run: ./install_apps android

      - name: Run tests
        working-directory: ${{ github.workspace }}/e2e
        timeout-minutes: 30
        run: ./run_tests android

      - name: Upload ~/.maestro artifacts
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: maestro-root-dir-android
          path: ~/.maestro
          retention-days: 7
          include-hidden-files: true

  # Reads maestro-android/supported-apis.properties once; test-start-device's matrix comes from here.
  # A pull request boots max plus any level it adds; a device change, a new file, or a manual
  # dispatch boots the whole range.
  range:
    name: Read the driver's declared API range
    runs-on: ubuntu-latest
    outputs:
      device: ${{ steps.read.outputs.device }}
      os_list: ${{ steps.read.outputs.os_list }}
    steps:
      - uses: actions/checkout@v6

      - id: read
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          file=maestro-android/supported-apis.properties
          min=$(sed -n 's/^min=//p' "$file")
          max=$(sed -n 's/^max=//p' "$file")
          device=$(sed -n 's/^device=//p' "$file")
          # max may carry a minor platform version (37.1); its integer part is the API level.
          if ! printf '%s' "$min" | grep -qE '^[0-9]+$' || ! printf '%s' "$max" | grep -qE '^[0-9]+(\.[0-9]+)?$' || [ -z "$device" ]; then
            echo "::error::$file must declare min=<N>, max=<N> or <N>.<M>, and device=<model> (got min='$min' max='$max' device='$device')"
            exit 1
          fi
          max_api="${max%%.*}"
          if [ "$min" -gt "$max_api" ]; then
            echo "::error::$file: min=$min is above max=$max"
            exit 1
          fi
          # max may not exceed compileSdk.
          compile_sdk=$(sed -n 's/^[[:space:]]*compileSdk = \([0-9]*\).*/\1/p' maestro-android/build.gradle.kts)
          if [ -z "$compile_sdk" ] || [ "$max_api" -gt "$compile_sdk" ]; then
            echo "::error::$file declares max=$max but maestro-android/build.gradle.kts has compileSdk=$compile_sdk"
            exit 1
          fi

          # What this run boots. select_api_levels.sh does the range expansion and the
          # base-diff selection (unit-tested); this step decides which call to make.
          selected=$(bash .github/scripts/select_api_levels.sh "$min" "$max")
          reason="whole range ($EVENT)"
          if [ "$EVENT" = "pull_request" ]; then
            # A failed fetch leaves us unable to tell what the PR changed. Boot only max
            # rather than the whole range, so a base that isn't fetchable (force-pushed
            # base, shallow-fetch limits) doesn't spin up every emulator on an unrelated PR.
            if ! git fetch -q --depth=1 origin "$BASE_SHA"; then
              selected="android-$max"
              reason="base $BASE_SHA unfetchable; booting max only"
            elif base=$(git show "$BASE_SHA:$file" 2>/dev/null); then
              bmin=$(printf '%s\n' "$base" | sed -n 's/^min=//p')
              bmax=$(printf '%s\n' "$base" | sed -n 's/^max=//p')
              bdevice=$(printf '%s\n' "$base" | sed -n 's/^device=//p')
              if [ "$bdevice" = "$device" ]; then
                selected=$(bash .github/scripts/select_api_levels.sh "$min" "$max" "$bmin" "$bmax")
                reason="max plus levels this PR adds (base declared $bmin..$bmax)"
              else
                reason="device changed ($bdevice -> $device)"
              fi
            else
              reason="file is new in this PR"
            fi
          fi

          os_list="[$(printf '%s\n' "$selected" | sed 's/^/"/; s/$/"/' | paste -sd, -)]"
          echo "Driver declares android-$min..android-$max on $device (compileSdk $compile_sdk). Booting $reason: $os_list"
          echo "device=$device" >> "$GITHUB_OUTPUT"
          echo "os_list=$os_list" >> "$GITHUB_OUTPUT"

  # Boots every declared API level on the declared device through `maestro start-device`, the CLI
  # provisioning path test-android bypasses. Red blocks the PR via e2e-gate.
  test-start-device:
    name: Start device on Android (${{ matrix.os }})
    runs-on: ubuntu-latest
    needs: [build, validate-inputs, range]
    if: ${{ always() && needs.build.result == 'success' && needs.range.result == 'success' && (needs.validate-inputs.result == 'success' || needs.validate-inputs.result == 'skipped') && (github.event_name == 'pull_request' || inputs.platform == 'android') }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.range.outputs.os_list) }}

    env:
      ANDROID_HOME: /home/runner/androidsdk
      ANDROID_SDK_ROOT: /home/runner/androidsdk
      DEVICE: ${{ needs.range.outputs.device }}
      OS: ${{ matrix.os }}
      # ms; software rendering boots slower than the CLI's 180s default allows.
      MAESTRO_DEVICE_BOOT_TIMEOUT: "600000"

    steps:
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android Command-line Tools
        run: |
          sh .github/scripts/install_android_sdk "$ANDROID_CMDLINE_TOOLS_ZIP"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$PATH" >> $GITHUB_PATH

      - name: Set up Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install emulator
          echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH
          sdkmanager --install "platform-tools"
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          # Pre-install the image the CLI derives; a different derivation fails on the y/n prompt (no stdin).
          sdkmanager --install "system-images;$OS;google_apis;x86_64"
          # The CLI finds the emulator through adb; on a dev machine a server is normally already up.
          "$ANDROID_HOME/platform-tools/adb" start-server

      - name: Download Maestro build from previous job
        uses: actions/download-artifact@v8
        with:
          name: maestro-cli-ubuntu-latest-jdk17-run_id${{ github.run_id }}

      - name: Add Maestro CLI executable to PATH
        run: |
          unzip maestro.zip -d maestro_extracted
          echo "$PWD/maestro_extracted/maestro/bin" >> $GITHUB_PATH

      - name: Create and boot the device with maestro start-device
        run: |
          # The CLI launches the emulator like a user does: with a window and audio. The runner has
          # neither, so give it a virtual display and the PulseAudio client library qemu links against.
          # Xvfb must outlive this step: the emulator keeps its window on it while later steps verify.
          sudo apt-get install -y -qq xvfb libpulse0 >/dev/null
          Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          export DISPLAY=:99
          maestro --verbose start-device \
            --platform android \
            --device-model "$DEVICE" \
            --device-os "$OS"

      - name: Emulator diagnostics
        if: failure()
        run: |
          # The CLI swallows the emulator's output. Relaunch the AVD it created, the same way the
          # CLI does plus -verbose, and print why it does or does not come up.
          adb devices
          avd="Maestro_ANDROID_${DEVICE}_${OS}"
          emulator -list-avds
          (emulator -avd "$avd" -netdelay none -netspeed full -verbose >~/emulator.log 2>&1 &)
          sleep 90
          adb devices
          echo "=== emulator.log (tail) ==="
          tail -n 80 ~/emulator.log || true
          adb emu kill || true

      - name: Verify the booted device is the one the CLI was asked for
        run: |
          adb devices
          # adbd goes offline for a moment right after boot, so fetch the serial inside the
          # loop too: a device that is momentarily offline reappears rather than failing the job.
          serial=""
          booted=""
          for i in $(seq 1 60); do
            serial=$(adb devices | awk 'NR > 1 && $2 == "device" { print $1; exit }')
            if [ -n "$serial" ]; then
              # || true: if the device flips offline mid-poll the pipeline fails under
              # pipefail; swallow it so the loop retries instead of aborting the step.
              booted=$(adb -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              [ "$booted" = "1" ] && break
            fi
            sleep 2
          done
          if [ -z "$serial" ]; then
            echo "::error::start-device exited 0 but no device came online"
            exit 1
          fi
          expected="Maestro_ANDROID_${DEVICE}_${OS}"
          api="${OS#android-}"; api="${api%%.*}"
          # Assert boot first: a device that never finished booting makes the AVD-name and SDK
          # reads below return empty, which would otherwise fail with a misleading name mismatch.
          [ "$booted" = "1" ] || { echo "::error::device did not finish booting (sys.boot_completed=$booted)"; exit 1; }
          actual=$(adb -s "$serial" emu avd name | head -n1 | tr -d '\r')
          sdk=$(adb -s "$serial" shell getprop ro.build.version.sdk | tr -d '\r')
          echo "avd=$actual sdk=$sdk boot_completed=$booted"
          [ "$actual" = "$expected" ] || { echo "::error::booted AVD '$actual', expected '$expected'"; exit 1; }
          [ "$sdk" = "$api" ] || { echo "::error::device reports SDK $sdk, expected $api"; exit 1; }

      - name: Stop the emulator
        if: always()
        run: adb emu kill || true

      - name: Upload ~/.maestro logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: maestro-start-device-${{ matrix.os }}
          path: ~/.maestro
          retention-days: 7
          include-hidden-files: true

  test-ios:
    name: Test on iOS
    runs-on: macos-26
    needs: [build, validate-inputs]
    if: ${{ always() && needs.build.result == 'success' && (needs.validate-inputs.result == 'success' || needs.validate-inputs.result == 'skipped') && (github.event_name == 'pull_request' || inputs.platform == 'ios') && inputs.flow == '' }}
    timeout-minutes: 120

    env:
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 240000 # 240s
      MAESTRO_CLI_LOG_PATTERN_CONSOLE: '%d{HH:mm:ss.SSS} [%5level] %logger.%method: %msg%n'
      MAESTRO_APP: ${{ inputs.app }}

    steps:
      - name: Clone repository (only needed for the e2e directory)
        uses: actions/checkout@v6


      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Build demo_app # Or fetch cached version
        uses: ./.github/actions/build-demo-app
        with:
          platform: ios

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: maestro-cli-macos-latest-jdk17-run_id${{ github.run_id }}

      - name: Add Maestro CLI executable to PATH
        run: |
          unzip maestro.zip -d maestro_extracted
          echo "$PWD/maestro_extracted/maestro/bin" >> $GITHUB_PATH

      - name: Check if Maestro CLI executable starts up
        run: |
          maestro --help
          maestro --version

      - name: Boot Simulator
        run: |
          xcrun simctl list runtimes
          export RUNTIME="iOS26.2"
          export DEVICE_TYPE="iPhone 17 Pro"
          ./.github/scripts/boot_simulator.sh

      - name: Download apps
        working-directory: ${{ github.workspace }}/e2e
        run: ./download_apps ios

      - name: Install apps
        working-directory: ${{ github.workspace }}/e2e
        run: ./install_apps ios

      - name: Start screen recording
        run: |
          xcrun simctl io booted recordVideo --codec h264 ~/screenrecord.mp4 &
          echo $! > ~/screenrecord.pid

      - name: Run tests
        working-directory: ${{ github.workspace }}/e2e
        timeout-minutes: 120
        run: ./run_tests ios

      - name: Install xcodegen
        # Required to generate the Xcode project for the SwiftUI fixture used
        # by the preflight regression test below.
        run: brew install xcodegen

      - name: Verify iOS UI-interruption preflight is suppressed
        # Regression guard for the XCTest UI-interruption preflight hang.
        # Builds a minimal SwiftUI app that presents a real UIAlertController,
        # runs a gesture against it, and asserts Apple's preflight signature
        # lines never appear in the xctest_runner log. Fails if the swizzle in
        # maestro-ios-xctest-runner/maestro-driver-iosUITests/Categories/
        # XCUIApplication+Helper.m regresses.
        run: ./e2e/alert-repro-swiftui/verify_preflight_suppressed.sh "$SIM_UDID"

      - name: Stop screen recording
        if: success() || failure()
        run: kill -SIGINT "$(cat ~/screenrecord.pid)"

      - name: Upload ~/.maestro artifacts
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: maestro-root-dir-ios
          path: ~/.maestro
          retention-days: 7
          include-hidden-files: true

      - name: Upload screen recording of Simulator
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: maestro-screenrecord-ios.mp4
          path: ~/screenrecord.mp4
          retention-days: 7

  test-ios-xctest-runner:
    name: Test on iOS (XCTest Runner only)
    if: false  # Disabled: This needs be fixed, not working yet.
    runs-on: macos-latest
    needs: build
    timeout-minutes: 30

    steps:
      - name: Clone repository (only needed for the e2e directory)
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Download Maestro artifact
        uses: actions/download-artifact@v8
        with:
          name: maestro-cli-macos-latest-jdk17-run_id${{ github.run_id }}

      - name: Download build/Products artifact
        uses: actions/download-artifact@v8
        with:
          name: build__Products-jdk17
          path: build/Products

      - name: Add Maestro CLI executable to PATH
        run: |
          unzip maestro.zip -d maestro_extracted
          echo "$PWD/maestro_extracted/maestro/bin" >> $GITHUB_PATH

      - name: Check if Maestro CLI executable starts up
        run: |
          maestro --help
          maestro --version

      - name: Boot Simulator
        run: ./.github/scripts/boot_simulator.sh

      - name: Run tests
        timeout-minutes: 15
        run: ./maestro-ios-xctest-runner/test-maestro-ios-runner.sh

      - name: Upload xc test runner logs
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: test-ios-xctest-runner__xctest_runner_logs
          path: ~/Library/Logs/maestro/xctest_runner_logs
          retention-days: 7
          include-hidden-files: true

  test-cli:
    name: Verify CLI version on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java-version: [17]

    defaults:
      run:
        shell: bash

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ matrix.java-version }}

      - name: Download Maestro CLI artifact
        uses: actions/download-artifact@v8
        with:
          name: maestro-cli-${{ matrix.os }}-jdk${{ matrix.java-version }}-run_id${{ github.run_id }}

      - name: Add Maestro CLI to PATH (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          unzip maestro.zip -d maestro_extracted
          echo "$PWD/maestro_extracted/maestro/bin" >> $GITHUB_PATH

      - name: Add Maestro CLI to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -Path maestro.zip -DestinationPath maestro_extracted
          "$PWD\maestro_extracted\maestro\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Test CLI (Linux / macOS)
        if: runner.os != 'Windows'
        run: e2e/cli/test-cli.sh

      - name: Test CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: e2e/cli/test-cli.ps1

  # Single required status check for the branch ruleset. A workflow name ("Test E2E") is not a check
  # context — only jobs are — so main's ruleset requires this one job instead of enumerating each
  # platform. It passes only when every platform job succeeded.
  #
  # always() is deliberate: without it a failed/cancelled upstream job would SKIP this gate, and a
  # skipped required check reports as passing — the merge would go through with E2E red. Running
  # always() turns any non-success (failure, cancelled, or skipped — e.g. build failed so the
  # platform jobs never ran) into a red gate. Scoped to pull_request because that is the only event
  # that gates a merge; a single-platform workflow_dispatch would otherwise fail the gate on the two
  # platforms it intentionally skipped.
  e2e-gate:
    name: E2E gate
    runs-on: ubuntu-latest
    needs: [test-web, test-android, test-start-device, test-ios]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Require all E2E platform jobs to succeed
        run: |
          web='${{ needs.test-web.result }}'
          android='${{ needs.test-android.result }}'
          start_device='${{ needs.test-start-device.result }}'
          ios='${{ needs.test-ios.result }}'
          echo "test-web=$web  test-android=$android  test-start-device=$start_device  test-ios=$ios"
          failed=0
          for result in "$web" "$android" "$start_device" "$ios"; do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::E2E gate failed — one or more platform jobs did not succeed"
            exit 1
          fi
          echo "All E2E platform jobs succeeded."
