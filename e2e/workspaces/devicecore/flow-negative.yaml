appId: org.wikimedia.wikipedia
tags:
  - ios
---
# Negative control. A device-core-routed assert on a string that's provably absent on the Wikipedia
# onboarding screen: device-core resolves it Absent -> verdict false -> the flow FAILS at that step.
# This proves the green in flow.yaml was device-core-decided, not a legacy pass-through.
# Requires MAESTRO_DEVICECORE_ASSERT=1 and a booted iOS sim with Wikipedia installed.
- launchApp:
    clearState: true
- assertVisible: "Skip"                        # device-core: present -> passes
- assertVisible: "This Text Is Absent 9F3K2Q"  # device-core: absent -> fails here (exit 1)
