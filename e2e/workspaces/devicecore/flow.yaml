appId: org.wikimedia.wikipedia
tags:
  - ios
---
# Interleaves BOTH drivers in one `maestro test` run, on a real app (Wikipedia).
# Requires MAESTRO_DEVICECORE_ASSERT=1 and a booted iOS sim with Wikipedia installed
# (e2e/download_apps ios && e2e/install_apps ios). No manual driver-server start: device-core
# self-provisions its 8792 server from the jar-embedded assembly on the first routed assert.
#
# Routing (Orchestra.assertConditionCommand): a standalone assertVisible whose selector is a single
# LITERAL text (no regex metacharacters, no id, no relational/state constraint) diverts to
# maestro-device-core's inspect(); everything else stays on legacy. So here:
#   - launchApp, the regex assertVisible, and tapOn  -> legacy XCUITest driver (:22087)
#   - the two literal-text assertVisible              -> maestro-device-core (:8792)
# The two drivers run co-resident; device-core launches its server on the first routed assert and
# leaves it up, and the second routed assert reuses it.
- launchApp:
    clearState: true
- assertVisible: "Skip"       # device-core: literal -> routed
- assertVisible: "Skip.*"     # legacy: regex metachars -> NOT routed (matches "Skip")
- assertVisible: "Next"       # device-core: literal -> routed
- tapOn: "Skip"               # legacy: real tap (last command; dismisses onboarding)
