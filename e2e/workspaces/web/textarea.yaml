url: data:text/html;charset=utf-8,%3C%21doctype%20html%3E%3Chtml%3E%3Chead%3E%3Cmeta%20charset%3Dutf-8%3E%3Ctitle%3ETextarea%3C%2Ftitle%3E%3Cstyle%3Ebody%7Bfont-family%3Asans-serif%3Bpadding%3A40px%3Bfont-size%3A20px%7Dtextarea%7Bfont-size%3A20px%3Bwidth%3A400px%7D%3C%2Fstyle%3E%3C%2Fhead%3E%3Cbody%3E%3Clabel%20for%3D%27notes%27%3ENotes%3C%2Flabel%3E%3Cbr%3E%3Ctextarea%20id%3D%27notes%27%20rows%3D%275%27%20placeholder%3D%27Nothing%20typed%20yet%27%3E%3C%2Ftextarea%3E%3C%2Fbody%3E%3C%2Fhtml%3E
name: Textarea contents should appear in the hierarchy
tags:
  - passing
  - web
---
# A textarea reports its value, or its placeholder while it is empty (maestro-web.js
# getNodeText). This used to drive pastebin.com, which has since replaced its plain textarea
# with a rich editor: the id the flow targeted now belongs to a wrapper reporting "New Paste",
# so the typed text never reached the hierarchy at all. The behaviour under test is Maestro's,
# so the page is ours.
- launchApp
- assertVisible: "Nothing typed yet"
- tapOn:
    id: "notes"
- inputText: Potato
- assertVisible: Potato
- assertNotVisible: "Nothing typed yet"
