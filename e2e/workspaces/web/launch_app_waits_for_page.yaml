url: http://127.0.0.1:7357/launch_redirect.html
name: launchApp should return only once the page it opened is there
tags:
  - passing
  - web
---
# The fixture redirects to another site from a script before it has loaded, so the navigation
# launchApp starts is followed at once by a second one that swaps the page's renderer. A
# launchApp that returns while that is still going on leaves the next command talking to a page
# that is being replaced: the screenshot below then either fails or gets no answer for 30
# seconds. Several rounds, because the window is a few milliseconds wide and one round can miss it.
- launchApp
- takeScreenshot: launch_app_waits_for_page_1
- launchApp
- takeScreenshot: launch_app_waits_for_page_2
- launchApp
- takeScreenshot: launch_app_waits_for_page_3
- launchApp
- takeScreenshot: launch_app_waits_for_page_4
- launchApp
- takeScreenshot: launch_app_waits_for_page_5

- assertVisible: "Landed"
