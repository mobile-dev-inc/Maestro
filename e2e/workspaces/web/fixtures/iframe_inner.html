<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Inner frame</title>
  <style>
    body { font-family: sans-serif; font-size: 18px; padding: 16px; background: #eef }
    input { font-size: 18px; padding: 6px; width: 240px }
  </style>
</head>
<body>
  <p>Hello from inside the iframe</p>
  <input id="field" placeholder="Type here...">
  <button id="echo" onclick="document.getElementById('echo-output').textContent = document.getElementById('field').value">Echo</button>
  <div id="echo-output">nothing echoed</div>
</body>
</html>
