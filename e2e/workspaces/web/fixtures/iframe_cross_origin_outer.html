<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cross-origin iframe</title>
  <style>body { font-family: sans-serif; margin: 0; padding: 48px }</style>
</head>
<body>
  <h1>Outer page</h1>
  <!-- A real different-origin frame: this page is served over http from 127.0.0.1, the frame
       over https from another host. Reading inside it needs the Selenium frame switch, since
       the browser will not hand over contentDocument across origins. -->
  <iframe src="https://www.saucedemo.com/" width="900" height="620" style="margin-left: 64px"></iframe>
</body>
</html>
