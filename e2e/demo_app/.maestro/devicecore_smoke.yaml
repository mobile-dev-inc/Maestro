appId: com.example.example
---
# device-core smoke: a tap-driven walk. Tap-as-verdict works on BOTH platforms (Outcome.Acted
# proves the element was found and actionable). assertVisible is Android-only (waitFor-backed);
# on iOS assertVisible throws NotImplemented, so iOS relies on the taps as its checkpoints.
- launchApp
- runFlow:
    when: { platform: android }
    commands:
      - assertVisible: "Flutter Demo Home Page"
# id tap — the guaranteed cross-platform tap-as-verdict (FAB has a real resource-id).
- tapOn:
    id: "fabAddIcon"
- runFlow:
    when: { platform: android }
    commands:
      - assertVisible: "1"          # counter advanced
# text tap — navigate to the form screen.
- tapOn:
    text: "Form Test"
- runFlow:
    when: { platform: android }
    commands:
      - assertVisible: "Login"      # form screen AppBar title
