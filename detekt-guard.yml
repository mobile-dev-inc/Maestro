build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false
  excludes: ''

comments:
  active: false
complexity:
  active: false
coroutines:
  active: false
empty-blocks:
  active: false
exceptions:
  active: false
naming:
  active: false
performance:
  active: false
potential-bugs:
  active: false

style:
  active: true
  ForbiddenMethodCall:
    active: true
    methods:
      - reason: 'Resolve flow file paths through FileAccessScope.'
        value: 'java.io.File.<init>'
      - reason: 'Resolve flow file paths through FileAccessScope.'
        value: 'java.nio.file.Paths.get'
      - reason: 'Resolve flow file paths through FileAccessScope.'
        value: 'java.nio.file.Path.resolveSibling'
    excludes:
      - '**/test/**'
      - '**/FileAccessScope.kt'
      - '**/HttpClient.kt'
      - '**/TempFileHandler.kt'
    includes:
      - '**/maestro/orchestra/yaml/YamlFluentCommand.kt'
      - '**/maestro/orchestra/Orchestra.kt'
      - '**/maestro/utils/HttpUtils.kt'
      - '**/maestro/js/GraalJsHttp.kt'
